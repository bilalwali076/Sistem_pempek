<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stok Menu Premium | Kasir Pempek</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root { 
            --bg-base: #fdfbf7; 
            --surface: #ffffff;
            --brand-gradient: linear-gradient(135deg, #ff9f0e 0%, #ff5100 100%);
            --text-title: #1e1b18;
            --text-body: #6e675f;
            --border-soft: rgba(243, 237, 227, 0.7);
            --shadow-lux: 0 16px 40px -12px rgba(255, 107, 0, 0.08);
            --shadow-card: 0 24px 48px -16px rgba(30, 27, 24, 0.04);
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg-base); color: var(--text-title); display: flex; min-height: 100vh; overflow-x: hidden; }

        /* --- SIDEBAR --- */
        .sidebar { 
            width: 290px; background: var(--surface); height: 100vh; border-right: 1.5px solid var(--border-soft); 
            position: fixed; padding: 45px 28px; display: flex; flex-direction: column; left: 0; top: 0; z-index: 100;
        }
        .sidebar h2 { font-size: 22px; font-weight: 800; color: var(--text-title); margin-bottom: 45px; display: flex; align-items: center; gap: 12px; }
        .sidebar h2 span { background: var(--brand-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .sidebar .section-title { color: #a1978c; font-size: 11px; margin-bottom: 18px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
        
        .nav-container { display: flex; flex-direction: column; gap: 10px; flex: 1; }
        .nav-item { 
            text-decoration: none; color: var(--text-body); display: flex; align-items: center; gap: 14px;
            padding: 15px 20px; font-weight: 600; font-size: 14px; border-radius: 20px; transition: 0.3s;
        }
        .nav-item:hover { color: #ff5100; background: #fff8f1; transform: translateX(4px); }
        .nav-item.active { color: white; background: var(--brand-gradient); box-shadow: 0 10px 24px -8px rgba(255, 81, 0, 0.35); }
        
        /* --- TOMBOL LOGOUT DESKTOP (SIDEBAR) --- */
        .btn-logout { 
            color: #ef4444; cursor: pointer; border: none; background: #fff5f5; font-weight: 700; 
            padding: 15px 20px; border-radius: 18px; display: flex; align-items: center; gap: 14px; font-size: 14px; width: 100%; transition: 0.2s;
            margin-top: auto; /* Memastikan tombol terdorong ke posisi paling bawah */
        }
        .btn-logout:hover { background: #ffebeb; }
        
        /* --- MAIN AREA --- */
        .main { flex: 1; margin-left: 290px; padding: 0; width: calc(100% - 290px); min-height: 100vh; position: relative; }
        .fluid-header { background: var(--brand-gradient); padding: 60px 60px 100px 60px; color: white; position: relative; }
        .fluid-header h1 { font-size: 34px; font-weight: 800; letter-spacing: -1px; margin-bottom: 8px; }
        .fluid-header::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 40px; background: var(--bg-base); border-radius: 40px 40px 0 0; }
        
        .content-body { padding: 0 60px 60px 60px; margin-top: -50px; position: relative; z-index: 2; }
        .card { background: var(--surface); padding: 36px; border-radius: 32px; border: 1px solid var(--border-soft); box-shadow: var(--shadow-card); margin-bottom: 35px; }
        .card h3 { font-size: 18px; font-weight: 800; margin-bottom: 24px; display: flex; align-items: center; gap: 10px; }

        /* --- FORM --- */
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px; }
        label { display: block; font-size: 11px; font-weight: 800; color: #a1978c; margin-bottom: 8px; text-transform: uppercase; }
        input { padding: 14px 18px; border: 1.5px solid #eaddca; border-radius: 16px; font-size: 14px; font-weight: 600; width: 100%; outline: none; }
        input:focus { border-color: #ff6b00; }
        .btn-save { padding: 15px 30px; background: var(--brand-gradient); color: white; border: none; border-radius: 16px; cursor: pointer; font-weight: 700; }
        
        /* --- TABEL --- */
        .table-container { width: 100%; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 18px 24px; background: #faf8f5; font-size: 11px; font-weight: 800; color: #a1978c; border-bottom: 2px solid var(--border-soft); }
        td { padding: 20px 24px; border-bottom: 1px solid var(--border-soft); font-size: 14px; font-weight: 600; }

        /* --- MOBILE NAV --- */
        .bottom-nav { display: none; }
        @media screen and (max-width: 1024px) {
            body { padding-bottom: 110px; } /* Memberikan ruang ekstra di bawah agar konten tidak tertutup nav menu */
            .sidebar { display: none; }
            .main { margin-left: 0; padding: 0; width: 100%; }
            .content-body { padding: 0 16px; margin-top: -45px; }
            .form-grid { grid-template-columns: 1fr; }
            
            /* --- TAMBAHAN BAGIAN RIWAYAT TABEL MENGECIL UNTUK HP --- */
            table { min-width: 100% !important; table-layout: fixed !important; }
            th, td { padding: 12px 8px !important; font-size: 11.5px !important; word-wrap: break-word; white-space: normal; }
            th { font-size: 10px !important; }
            /* -------------------------------------------------------- */
            
            .bottom-nav { 
                display: flex; position: fixed; bottom: 20px; left: 20px; right: 20px; 
                background: #1e1b18; height: 76px; border-radius: 28px; z-index: 999; 
                justify-content: space-around; align-items: center; padding: 0 10px;
                box-shadow: 0 20px 40px rgba(30, 27, 24, 0.25);
            }
            .bottom-nav-item { 
                color: #8c8275; text-decoration: none; font-size: 10px; font-weight: 700; 
                display: flex; flex-direction: column; align-items: center; gap: 5px; 
                justify-content: center; width: 60px; height: 100%; transition: all 0.2s;
            }
            .bottom-nav-item svg { width: 22px; height: 22px; color: #8c8275; }
            .bottom-nav-item.active { color: #ff9f0e; }
            .bottom-nav-item.active svg { color: #ff9f0e; }
            
            /* --- SIZING & WARNA SPESIFIK LOGOUT MOBILE --- */
            .bottom-nav-item.logout-mobile { color: #ff4d4d; }
            .bottom-nav-item.logout-mobile svg { color: #ff4d4d; }
        }
    </style>
</head>
<body>

    <div class="sidebar" id="sidebar">
        <h2>🥟 <span>Kasir Pempek</span></h2>
        <p class="section-title">Menu Utama</p>
        <div class="nav-container">
            <a href="outlet_dashboard1.html" class="nav-item">
                <i data-lucide="layout-grid"></i> Dashboard
            </a>
            <a href="outlet_stok1.html" class="nav-item active">
                <i data-lucide="layers"></i> Stok Menu
            </a>
            <a href="outlet_jual1.html" class="nav-item">
                <i data-lucide="calculator"></i> Pencatatan Jual
            </a>
            <a href="outlet_laporan 1.html" class="nav-item">
                <i data-lucide="line-chart"></i> Laporan
            </a>
        </div>
        <button onclick="logout()" class="btn-logout">
            <i data-lucide="power"></i> Keluar Sesi
        </button>
    </div>

    <div class="main">
        <div class="fluid-header">
            <h1>Manajemen Stok</h1>
            <p>Tambah pasokan porsi pempek ke dalam database gudang pusat.</p>
        </div>

        <div class="content-body">
            <div class="card">
                <h3><i data-lucide="plus-circle" style="color:#ff6b00"></i> Tambah Pasokan Baru</h3>
                <div class="form-grid">
                    <div>
                        <label>ID Pempek (Otomatis)</label>
                        <input type="text" id="id_pempek" readonly style="background:#fdfdfd; color:#6e675f;">
                    </div>
                    <div>
                        <label>Pempek Masuk (Qty Porsi)</label>
                        <input type="number" id="qty" value="100" min="1">
                    </div>
                </div>
                <button onclick="simpanStok()" id="btnSimpan" class="btn-save">Simpan Stok Masuk</button>
            </div>

            <div class="card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <h3><i data-lucide="database" style="color:#ff6b00"></i> Riwayat Stok Masuk</h3>
                    <button onclick="loadStokData()" style="background:#fff8f1; color:#ff5100; border:none; padding:8px 16px; border-radius:12px; cursor:pointer; font-weight:700;">Refresh</button>
                </div>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>ID PEMPEK</th>
                                <th style="text-align: center;">PEMPEK MASUK (QTY)</th>
                                <th>TANGGAL MASUK</th>
                            </tr>
                        </thead>
                        <tbody id="tabelStok">
                            <tr><td colspan="3" style="text-align:center; padding:30px;">Memuat data...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <a href="outlet_dashboard1.html" class="bottom-nav-item"><i data-lucide="layout-grid"></i>Dashboard</a>
        <a href="outlet_stok1.html" class="bottom-nav-item active"><i data-lucide="layers"></i>Stok</a>
        <a href="outlet_jual1.html" class="bottom-nav-item"><i data-lucide="calculator"></i>Transaksi</a>
        <a href="outlet_laporan 1.html" class="bottom-nav-item"><i data-lucide="line-chart"></i>Laporan</a>
        <a href="#" onclick="logout()" class="bottom-nav-item logout-mobile"><i data-lucide="power"></i>Keluar</a>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbzzmDaiz54a98Zb-pmZkpNkL3N0JB6fQZDpKZMDsIARNoOwVfnoRIuMlvtagd2jAHGc/exec";

        function generateIDPempek() {
            const sekarang = new Date();
            document.getElementById("id_pempek").value = `PMK-${sekarang.getFullYear()}${String(sekarang.getMonth()+1).padStart(2,'0')}${String(sekarang.getDate()).padStart(2,'0')}${String(sekarang.getHours()).padStart(2,'0')}${String(sekarang.getMinutes()).padStart(2,'0')}`;
        }

        async function loadStokData() {
            const tbody = document.getElementById("tabelStok");
            try {
                const res = await fetch(`${API_URL}?action=readStokNew`);
                const data = await res.json();
                tbody.innerHTML = "";
                if(!data || data.length === 0) tbody.innerHTML = "<tr><td colspan='3' style='text-align:center; padding:20px;'>Data kosong.</td></tr>";
                else data.reverse().forEach(s => {
                    tbody.innerHTML += `<tr>
                        <td><span style="font-family:monospace; font-weight:700; color:#475569;">${s.id_pempek}</span></td>
                        <td style="text-align:center; font-weight:800; color:#ff6b00;">${s.qty_masuk} Porsi</td>
                        <td style="color:#6e675f;">${s.tanggal}</td>
                    </tr>`;
                });
            } catch(e) { tbody.innerHTML = "<tr><td colspan='3' style='text-align:center; color:red;'>Gagal memuat.</td></tr>"; }
        }

        async function simpanStok() {
            const id = document.getElementById("id_pempek").value;
            const qty = document.getElementById("qty").value;
            const btn = document.getElementById("btnSimpan");
            if(!qty || qty <= 0) return alert("Jumlah tidak valid!");
            btn.disabled = true; btn.innerText = "Memproses...";
            try {
                const res = await fetch(`${API_URL}?action=addStokNew&id_pempek=${id}&qty=${qty}`);
                const result = await res.json();
                if(result.result === "success") { alert("Sukses!"); generateIDPempek(); loadStokData(); }
            } catch(e) { alert("Error!"); } finally { btn.disabled = false; btn.innerText = "Simpan Stok Masuk"; }
        }

        function logout() { 
            // Menghapus data sesi secara spesifik dari localStorage
            localStorage.removeItem("session");
            localStorage.removeItem("username");
            localStorage.removeItem("nama");
            localStorage.removeItem("role");
            localStorage.removeItem("outlet");
            localStorage.removeItem("spreadsheetId");
            
            // Redirect kembali ke halaman utama login
            window.location.href = "index.html"; 
        }

        window.onload = () => { generateIDPempek(); loadStokData(); lucide.createIcons(); };
    </script>
</body>
</html>
